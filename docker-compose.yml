services:
  gestor-documentos-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Variables de Vite: se inyectan en tiempo de build.
      # Se pueden sobrescribir desde el entorno o desde un .env local.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_JOB_TIMEOUT_MS: ${VITE_JOB_TIMEOUT_MS:-720000}
    image: gestor-documentos-frontend:latest
    container_name: gestor-documentos-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
