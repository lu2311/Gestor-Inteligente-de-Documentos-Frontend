services:
  gestor-documentos-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestor-documentos-frontend:latest
    container_name: gestor-documentos-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
