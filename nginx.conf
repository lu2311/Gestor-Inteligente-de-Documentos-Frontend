server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Comprime texto/JS/CSS para acelerar la carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cachea agresivamente los assets con hash en el nombre (JS/CSS generados por Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fuentes/íconos
    location ~* \.(woff2?|ttf|eot|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # =======================================================
    # REVERSE PROXY A BACKEND API (Para acceso local y LAN)
    # =======================================================

    # DNS interno de Docker Compose: permite re-resolver el nombre del backend
    # en cada petición (TTL de 10s). Sin esto, nginx resuelve "backend-api" una
    # sola vez al arrancar, cachea esa IP y devuelve 502 (connection refused)
    # cuando el contenedor del backend se recrea con otra IP (p. ej. tras un
    # "docker compose build backend-api && up -d").
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend como variable: obliga a nginx a resolverlo por petición vía el
    # resolver de arriba en lugar de fijar la IP al iniciar.
    set $backend_api "http://backend-api:3000";

    # Proxy para el Chatbot con SSE Streaming sin buffering
    location /chat/ {
        # Con variables en proxy_pass la URI de la directiva se envía literal,
        # así que reenviamos la URI original completa ($request_uri).
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy para subida de documentos
    location /upload {
        proxy_pass $backend_api$request_uri;
        client_max_body_size 25M;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
    }

    # Proxy para consulta de documentos e historial
    location /documents {
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA: cualquier ruta que no exista como archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Endpoint simple para healthcheck del contenedor
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
