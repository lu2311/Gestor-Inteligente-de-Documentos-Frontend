name: CI Frontend

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

  build:
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t gestor-documentos-frontend:latest .

      - name: Ejecutar contenedor
        run: |
          docker run -d \
            --name gestor-documentos-frontend \
            -p 8080:80 \
            gestor-documentos-frontend:latest

      - name: Verificar aplicación
        run: |
          sleep 5
          curl --fail http://localhost:8080/healthz

      - name: Detener contenedor
        if: always()
        run: docker stop gestor-documentos-frontend || true

  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          # Historial completo: Gitleaks escanea también los commits nuevos.
          fetch-depth: 0

      # Escaneo de secretos. Es gratuito en repositorios de usuario;
      # en repositorios de organización requiere GITLEAKS_LICENSE.
      - name: Escaneo de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}