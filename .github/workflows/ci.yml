name: CI Frontend

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

# Si se empuja de nuevo sobre la misma rama, cancela la ejecución anterior
# en lugar de dejar dos pipelines compitiendo.
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo lectura del repositorio.
permissions:
  contents: read

jobs:
  # Validación estática y build. Antes había 3 jobs encadenados que
  # reinstalaban dependencias 3 veces; así se instala una sola vez.
  ci:
    name: Lint, formato y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Compilar proyecto
        run: npm run build

  # Prueba de humo real: construye la imagen y comprueba que la app responde.
  docker:
    name: Prueba de humo Docker
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Construir imagen Docker
        run: docker build -t gestor-documentos-frontend:latest .

      - name: Ejecutar contenedor
        run: |
          # nginx resuelve `backend-api` al arrancar (proxy_pass). En CI ese
          # host no existe, así que lo mapeamos a localhost para que nginx
          # arranque; el smoke test solo comprueba el estático y /healthz.
          docker run -d \
            --name gestor-documentos-frontend \
            --add-host backend-api:127.0.0.1 \
            -p 8080:80 \
            gestor-documentos-frontend:latest

      - name: Verificar aplicación
        run: |
          for intento in $(seq 1 10); do
            if curl --fail --silent http://localhost:8080/healthz; then
              exit 0
            fi
            echo "Intento ${intento}: la aplicación aún no responde en /healthz"
            sleep 2
          done
          echo "La aplicación no respondió en /healthz" >&2
          docker logs gestor-documentos-frontend
          exit 1

      - name: Detener contenedor
        if: always()
        run: docker stop gestor-documentos-frontend || true

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          # Historial completo: Gitleaks escanea también los commits nuevos.
          fetch-depth: 0

      # Escaneo de secretos. Es gratuito en repositorios de usuario;
      # en repositorios de organización requiere GITLEAKS_LICENSE.
      - name: Escaneo de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
